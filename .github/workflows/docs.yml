name: Documentation

on:
  push:
    branches: [main]
    paths: &site-paths
      - "**"
      # Not part of the built site
      - "!_exclude/**"
      - "!scripts/**"
      - "!_redirects.json"
      - "!_redirects_moin.json"
      - "!.github/dependabot.yml"
      - "!.github/workflows/linkcheck.yml"
      - "!.dockerignore"
      - "!Dockerfile"
      - "!Procfile"
      - "!nginx.conf"
      - "!.pre-commit-config.yaml"
      - "!.env.example"
      - "!LICENSE-*"
      - "!Makefile"
      - "!oauth/**"
      # Rendered by autodoc in contributing/api.md
      - "oauth/app.py"
  pull_request:
    branches: [main]
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      # Sphinx rewrites every page when any template is newer than the last
      # build, and uv stamps .venv files with install time. The cache key below
      # already forces a clean build whenever uv.lock changes.
      - name: Pin theme template mtimes
        run: find .venv -name '*.html' -exec touch -d @946684800 {} +

      - name: Restore Sphinx build cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: _build
          key: sphinx-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            sphinx-${{ hashFiles('uv.lock') }}-

      - name: Build Sphinx site
        run: uv run sphinx-build -b html . _build/html -d _build/doctrees -j auto --keep-going

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

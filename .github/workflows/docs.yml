name: Documentation

on:
  push:
    branches: [main]
    paths: &site-paths
      - "**"
      # Not part of the built site
      - "!_exclude/**"
      - "!scripts/**"
      - "!_redirects_moin.json"
      - "!.github/dependabot.yml"
      - "!.github/workflows/linkcheck.yml"
      - "!.dockerignore"
      - "!Dockerfile"
      - "!Procfile"
      - "!nginx.conf"
      - "!.pre-commit-config.yaml"
      - "!.env.example"
      - "!LICENSE-*"
      - "!Makefile"
      - "!oauth/**"
      # Rendered by autodoc in contributing/api.md
      - "oauth/app.py"
      # Imported by Sphinx to generate legacy redirects on every build
      - "scripts/gen_redirect_pages.py"
      - "scripts/tests/**"
  pull_request:
    branches: [main]
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Test legacy redirects
        run: uv run python -m unittest discover -s scripts/tests -v

      # Sphinx rewrites every page when any template is newer than the last
      # build, and uv stamps .venv files with install time. The cache key below
      # already forces a clean build whenever uv.lock changes.
      - name: Pin theme template mtimes
        run: find .venv -name '*.html' -exec touch -d @946684800 {} +

      - name: Restore Sphinx build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build
          key: sphinx-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            sphinx-${{ hashFiles('uv.lock') }}-

      - name: Build Sphinx site
        run: uv run sphinx-build -b html . _build/html -d _build/doctrees -j auto --keep-going

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly, Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    name: Check for Dead Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Run Sphinx linkcheck
        run: uv run sphinx-build -b linkcheck . _build/linkcheck -j auto --keep-going 2>&1 | tee linkcheck.log || true

      - name: Upload linkcheck results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkcheck-results
          path: |
            _build/linkcheck/output.txt
            _build/linkcheck/output.json
            linkcheck.log
          retention-days: 30
